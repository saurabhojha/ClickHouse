name: Build arm_darwin (local artifact)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch/tag/SHA). Leave empty to build current default branch HEAD.'
        required: false
        default: ''

jobs:
  build-arm-darwin:
    runs-on: macos-14

    steps:
      # Same action family as in release_branches.yml
      - name: Checkout (recursive)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
          submodules: recursive

      # Use GitHub Actions cache (same action family as release_branches.yml)
      - name: Prepare ccache dir
        run: |
          mkdir -p $HOME/.cache/ccache

      - name: Cache ccache
        uses: actions/cache@v3
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-arm64-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-arm64-${{ github.ref_name }}-
            ccache-${{ runner.os }}-arm64-

      # Build using the same general approach (cmake+ninja) as the release workflows
      - name: Install build deps (brew)
        run: |
          brew update
          brew install cmake ninja ccache llvm icu4c openssl@3 zstd lz4 protobuf c-ares || true
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Configure (Release, arm64)
        env:
          CC:  clang
          CXX: clang++
        run: |
          # Prefer Homebrew LLVM if present
          if command -v /opt/homebrew/opt/llvm/bin/clang >/dev/null 2>&1; then
            export CC=/opt/homebrew/opt/llvm/bin/clang
            export CXX=/opt/homebrew/opt/llvm/bin/clang++
          fi

          # Helpful library hints (matches what upstream mac builds expect)
          export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          export OPENSSL_INCLUDE_DIR="${OPENSSL_ROOT_DIR}/include"
          export OPENSSL_LIBRARIES="${OPENSSL_ROOT_DIR}/lib"
          export ICU_ROOT="$(brew --prefix icu4c)"

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DENABLE_TESTS=OFF

      - name: Build ClickHouse (binary)
        run: |
          cmake --build build --target clickhouse -- -v
          ./build/programs/clickhouse --version
          file ./build/programs/clickhouse || true

      - name: Package for download
        run: |
          mkdir -p dist
          cp ./build/programs/clickhouse dist/clickhouse
          chmod +x dist/clickhouse
          cat > dist/README.txt <<'TXT'
          ClickHouse arm64-darwin (Apple Silicon) binary

          Quick use:
            xattr -d com.apple.quarantine ./clickhouse 2>/dev/null || true
            ./clickhouse --version
            ./clickhouse local -q "SELECT 1"

            # (optional) start a server:
            ./clickhouse server --daemon
            ./clickhouse client -q "SELECT version()"
          TXT
          tar -C dist -czf clickhouse-darwin-arm64.tar.gz .

      # Same artifact action family the upstream workflows use
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: clickhouse-darwin-arm64-${{ github.sha }}
          path: dist/clickhouse
          if-no-files-found: error
          compression-level: 0

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: clickhouse-darwin-arm64-tarball-${{ github.sha }}
          path: clickhouse-darwin-arm64.tar.gz
          if-no-files-found: error
